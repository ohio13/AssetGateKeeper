[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-gatekeeper"
dynamic = ["version"]
description = "Gate game assets against technical budgets: triangles, texture memory, materials, PBR realism, broken references."
readme = "README.md"
requires-python = ">=3.9"
# SPDX string (setuptools 77+): the TOML table and the license classifier are
# deprecated and would stop building in 2027.
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "AssetGatekeeper contributors" }]
keywords = ["gamedev", "pipeline", "technical-art", "assets", "ci", "linter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Software Development :: Quality Assurance",
]

# What the *gate* genuinely needs. trimesh and Pillow are required, not optional:
# the texture lookups and the deep mesh profiling cannot be done without them, and
# a gate that silently skips half its rules is worse than one that refuses to
# start. Everything else in this repository (the servers, the healer, the LOD
# engine, the workstation) is standard library only.
# charset-normalizer: trimesh needs it to read any .obj/.mtl that is not UTF-8
# (a cp1252 material name from an older Windows exporter); without it such a file
# fails as "could not read mesh".
# DracoPy: trimesh decodes Draco-compressed glTF (KHR_draco_mesh_compression, the
# usual web/three.js export) through it; without it every vertex reads as zero.
# trimesh and Pillow are capped below their next major version: a major release
# has changed loaders before, and a release must not break every check overnight.
# Raise the caps once the weekly dependency test passes on the new version.
dependencies = ["trimesh>=4.0,<6", "pillow>=9.0,<13", "charset-normalizer>=3.0", "DracoPy>=1.4",
                "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
# watchdog is a speed-up only: without it the watches fall back to polling.
full = ["watchdog>=3.0", "fast-simplification>=0.1.7; python_version >= '3.10'",
        "xatlas>=0.0.9; python_version >= '3.10'", "scipy>=1.7; python_version >= '3.10'"]
# --bake-polypaint and the review page's "Bake into a game asset": reduce, unwrap
# UVs, and bake ZBrush Polypaint into a BaseColor texture. Python 3.10+:
# fast-simplification does not import on 3.9.
bake = ["fast-simplification>=0.1.7; python_version >= '3.10'",
        "xatlas>=0.0.9; python_version >= '3.10'", "scipy>=1.7; python_version >= '3.10'"]
dev = ["pyflakes>=3.0"]
# Enterprise extras are split by feature so a studio installs only what it runs.
# Every one of them is optional: without it the feature refuses with an install
# hint instead of falling back to something weaker.
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.1"]
enterprise = ["psycopg[binary]>=3.1", "psycopg-pool>=3.1", "cryptography>=42"]
saml = ["signxml>=3.2"]

[project.scripts]
# The two commands a studio actually types. Everything below them is optional.
asset-gatekeeper = "asset_gatekeeper:main"
art-workstation = "agk_suite.server.art_workstation_server:main"
# The rest of the surface: the metrics dashboard, the launcher that owns ports
# and logs, and the bulk uploader that loads a folder of exports in one go.
asset-health = "agk_suite.server.asset_health_server:main"
art-workstation-upload = "agk_suite.tools.upload_assets:main"
agk-serve = "agk_suite.tools.agk_serve:main"
# Enterprise operations: trends, RBAC checks, remote validation, the PostgreSQL
# migration and the runner farm. See docs/ENTERPRISE.md.
agk-enterprise = "agk_suite.enterprise.cli:main"

[project.urls]
Homepage = "https://github.com/ohio13/AssetGateKeeper"
Issues = "https://github.com/ohio13/AssetGateKeeper/issues"
Changelog = "https://github.com/ohio13/AssetGateKeeper/blob/main/RELEASE_NOTES.md"

[tool.setuptools]
# Both modules ship: the gate loads healer.py by path from its own directory, so
# they must stay side by side in site-packages too.
include-package-data = true
py-modules = ["asset_gatekeeper", "healer", "notifier"]

# server/, engine/, tools/, enterprise/ and plugins/ travel with the wheel, but
# under agk_suite/ rather than at the top of site-packages, where names this
# common collide with other packages (9 Nov 2026 audit, B3). Inside agk_suite they
# keep their folder names, which is what the HERE/REPO_ROOT path bootstrapping in
# each module assumes.
packages = ["agk_suite", "agk_suite.server", "agk_suite.engine", "agk_suite.tools",
            "agk_suite.enterprise", "agk_suite.plugins", "agk_vendor", "agk_vendor.tomli",
            # Data-only folders, named so setuptools keeps shipping them: it warns
            # that unlisted ones "would be ignored" in a future release.
            "agk_suite.server.static", "agk_suite.server.static.vendor",
            "agk_suite.server.static.vendor.controls", "agk_suite.server.static.vendor.geometries",
            "agk_suite.server.static.vendor.loaders", "agk_suite.server.static.vendor.math",
            "agk_suite.server.static.vendor.utils",
            "agk_suite.plugins.blender", "agk_suite.plugins.houdini", "agk_suite.plugins.max",
            "agk_suite.plugins.maya", "agk_suite.plugins.unreal",
            # The game-engine plug-ins: C# (a Unity package) and GDScript (a Godot add-on).
            "agk_suite.plugins.unity", "agk_suite.plugins.unity.Editor",
            "agk_suite.plugins.godot", "agk_suite.plugins.godot.addons",
            "agk_suite.plugins.godot.addons.asset_gatekeeper"]

[tool.setuptools.package-dir]
"agk_suite.server" = "server"
"agk_suite.engine" = "engine"
"agk_suite.tools" = "tools"
"agk_suite.enterprise" = "enterprise"
"agk_suite.plugins" = "plugins"

[tool.setuptools.package-data]
# Without the static folder the workstation serves a 404 at /viewer and the
# dashboard renders unstyled, so this is not optional decoration.
"agk_suite.server" = ["static/*", "static/vendor/*", "static/vendor/**/*"]
"agk_suite.plugins" = ["**/*.py", "**/*.md", "**/*.mel", "**/*.ms", "**/*.json",
                       "**/*.cs", "**/*.asmdef", "**/*.meta", "**/*.gd", "**/*.cfg"]
"agk_vendor.tomli" = ["LICENSE", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "asset_gatekeeper.__version__" }
