[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-gatekeeper"
dynamic = ["version"]
description = "Gate game assets against technical budgets: triangles, texture memory, materials, PBR realism, broken references."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AssetGatekeeper contributors" }]
keywords = ["gamedev", "pipeline", "technical-art", "assets", "ci", "linter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Software Development :: Quality Assurance",
]

# What the *gate* genuinely needs. trimesh and Pillow are required, not optional:
# the texture lookups and the deep mesh profiling cannot be done without them, and
# a gate that silently skips half its rules is worse than one that refuses to
# start. Everything else in this repository (the servers, the healer, the LOD
# engine, the workstation) is standard library only.
dependencies = ["trimesh>=4.0", "pillow>=9.0"]

[project.optional-dependencies]
# watchdog is a speed-up only: without it the watches fall back to polling.
full = ["watchdog>=3.0"]
dev = ["pyflakes>=3.0"]

[project.scripts]
asset-gatekeeper = "asset_gatekeeper:main"
# The web UIs ship in the same distribution: one install gives an artist the
# gate, the metrics dashboard and the 3D review screen.
asset-health = "server.asset_health_server:main"
art-workstation = "server.art_workstation_server:main"
# Uploads a folder of .glb/.gltf/.obj into a running workstation: the review
# screen only takes one dropped file at a time, which is no way to load a project.
art-workstation-upload = "tools.upload_assets:main"
agk-serve = "tools.agk_serve:main"

[project.urls]
Homepage = "https://github.com/ohio13/asset-gatekeeper"
Issues = "https://github.com/ohio13/asset-gatekeeper/issues"

[tool.setuptools]
# Both modules ship: the gate loads healer.py by path from its own directory, so
# they must stay side by side in site-packages too.
py-modules = ["asset_gatekeeper", "healer", "notifier"]

[tool.setuptools.packages.find]
# server/ and engine/ are packages so that the dashboard, the workstation and the
# LOD decimator travel with the wheel. They keep their folder names, which is what
# the servers' own HERE/REPO_ROOT path bootstrapping already assumes.
include = ["server*", "engine*", "tools*"]
namespaces = false

[tool.setuptools.package-data]
# Without the static folder the workstation serves a 404 at /viewer and the
# dashboard renders unstyled, so this is not optional decoration.
server = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "asset_gatekeeper.__version__" }
