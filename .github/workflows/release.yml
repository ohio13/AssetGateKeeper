name: Release

# Push a tag such as v0.1.0-alpha.1 and this builds the wheel, the source
# archive and the drop-in ZIP, checks the wheel installs and runs, and puts all
# of them on a GitHub release with that version's section of RELEASE_NOTES.md.
#
# Before tagging: the version in asset_gatekeeper.py must be the tag's version,
# and the RELEASE_NOTES.md heading for it must carry a date, not "unreleased".
# The build refuses otherwise, before anything is published.
#
# PyPI is optional and off until the repository variable PUBLISH_TO_PYPI is
# set to "true" (Settings > Secrets and variables > Actions > Variables). It
# uses PyPI trusted publishing, so no password or token is ever stored here:
# on pypi.org, add a "pending publisher" for project asset-gatekeeper with
# owner ohio13, repository AssetGateKeeper, workflow release.yml and
# environment pypi.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag names the version in the source, and its notes are dated
        run: python tools/build_release.py --check-tag "$GITHUB_REF_NAME" --no-build
      - name: Build the wheel, the source archive and the drop-in ZIP
        run: |
          python -m pip install --upgrade pip build
          python tools/build_release.py
      # After the build, and into dist/: the build refuses a working tree with
      # anything new in it, and v0.1.0-alpha.1's first run failed on exactly
      # that (notes.md written beside the code).
      - name: This version's release notes
        run: python tools/build_release.py --notes dist/notes.md --no-build
      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/agk
          /tmp/agk/bin/pip install dist/*.whl
          /tmp/agk/bin/asset-gatekeeper --version
          mkdir -p /tmp/home && HOME=/tmp/home /tmp/agk/bin/agk-serve up
          curl -sf http://127.0.0.1:8100/viewer > /dev/null
          HOME=/tmp/home /tmp/agk/bin/agk-serve down
      - name: Alpha, beta or release candidate?
        id: kind
        run: |
          if echo "$GITHUB_REF_NAME" | grep -qiE '(a|alpha|b|beta|rc)[.-]?[0-9]*$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/notes.md

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every uploaded file sits in dist/, so the artifact's root is dist/
      # itself: put it back there.
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish the release with its files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "AssetGatekeeper $GITHUB_REF_NAME" --notes-file dist/notes.md $flags \
            dist/*.whl dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt

  pypi:
    name: PyPI (only when PUBLISH_TO_PYPI is true)
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # Every uploaded file sits in dist/, so the artifact's root is dist/
      # itself: put it back there.
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Keep only what PyPI takes
        run: mkdir upload && cp dist/*.whl dist/*.tar.gz upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
