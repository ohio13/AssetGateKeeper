name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two layers, same as the README: contract tests on every change, and one
# end-to-end run through the real watcher path (synthetic exporter, no DCC
# needed, so it is fast and hermetic).

jobs:
  tests:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
        # The README promises 3.9+; test the oldest and newest, and macOS once
        # (9 Nov 2026 audit, B5).
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install watchdog "trimesh<6" "pillow<13" numpy pyflakes charset-normalizer DracoPy "tomli; python_version < '3.11'"

      # Optional: the Polypaint bake. Its tests skip themselves without these.
      - name: Install bake extras
        continue-on-error: true
        run: python -m pip install fast-simplification xatlas scipy

      # bpy.props property annotations make pyflakes emit bogus F722
      # ("syntax error in forward annotation"), so the engine and tests are
      # linted here and the plugins are syntax-checked below instead.
      - name: Lint engine, server + tests
        run: python -m pyflakes asset_gatekeeper.py agk_gate/*.py healer.py notifier.py engine/lod_manager.py engine/fbx_preview.py engine/lod_shippable.py engine/polypaint.py tools/install_extras.py tests/fresh_install.py tools/upload_assets.py tools/houdini_export_hook.py server/asset_health_server.py server/art_workstation_server.py vcs_hooks/p4_pre_submit.py vcs_hooks/git_pre_commit.py tests/test_gatekeeper.py tests/test_server.py tests/test_workstation.py tests/test_viewer_browser.py tests/test_admin.py tests/gen_test_assets.py tests/run_headless_integration.py tests/test_formats.py tests/test_lod_collision.py tests/test_realworld.py tools/certify.py tools/build_release.py plugins/unreal/import_gatekeeper.py plugins/unreal/agk_validator.py tests/test_engine_plugins.py engine/rules_wizard.py tests/test_rules_wizard.py tests/test_skeleton_lightmap.py

      - name: Syntax-check DCC plugins
        run: python -m compileall -q plugins

      # The viewer is ~900 lines of ES modules and nothing else in this pipeline
      # parses it. A duplicate `const` shipped once and left the page blank.
      - name: Syntax-check the viewer
        shell: bash
        run: |
          cp server/static/viewer.js "$RUNNER_TEMP/viewer.mjs"
          node --check "$RUNNER_TEMP/viewer.mjs"

      - name: Generate fixtures
        run: python tests/gen_test_assets.py

      - name: Real-world regression suite (6 Nov corpus findings)
        run: python tests/test_realworld.py

      - name: Gate suite
        run: python tests/test_gatekeeper.py

      # --wizard: every answer combination writes a rules.toml the gate loads.
      - name: Rules wizard suite
        run: |
          python -m pyflakes engine/rules_wizard.py tests/test_rules_wizard.py
          python tests/test_rules_wizard.py

      - name: Workstation suite
        run: python tests/test_workstation.py

      # Spins the real dashboard server on an ephemeral port and drives it over
      # real sockets: ingest, bearer auth, 400/404/405/413, HTML, cascade delete.
      - name: Server suite
        run: python tests/test_server.py

      # Accounts, sessions, CSRF, role enforcement, atomic rules writes, the
      # audit trail and a streamed rescan - the parts a security review asks about.
      - name: Admin suite
        run: python tests/test_admin.py

      # No server, no IdP, no DCC: the enterprise suite fakes every
      # external system, and asserts the fail-closed path when one is absent.
      - name: Enterprise suite
        run: python tests/test_enterprise.py

      # The server's own queries, run twice: once on SQLite and once through
      # the PostgreSQL adapter (driver double). The numbers must be equal.
      - name: Analytics + storage parity
        run: python tests/test_analytics.py

      # FBX/TGA/JPG against Blender-made fixtures, hostile FBX, and the reference,
      # telemetry, remote-rules and Unreal fail-closed fixes.
      - name: Formats suite (FBX, TGA, JPG)
        run: python tests/test_formats.py

      - name: LOD and collision rules
        run: python tests/test_lod_collision.py
      # [skeleton] and [lightmap]: glTF and ASCII FBX built in the test.
      - name: Skeleton and lightmap UV suite
        run: python tests/test_skeleton_lightmap.py

      - name: Headless integration (synthetic exporter)
        run: python tests/run_headless_integration.py --synthetic

      # The --json fields the Unity and Godot plug-ins read, and that every
      # plug-in file ships. The engines themselves run in the two jobs below.
      - name: Engine plug-ins (gate contract, packaging)
        run: python tests/test_engine_plugins.py --only contract

  # plugins/unity without Unity: the C# compiled as netstandard2.1 / C# 9 (what
  # Unity 2021.3 uses) against stand-ins for UnityEngine/UnityEditor
  # (tests/unity_stubs), then driven end to end against the real gate.
  unity-plugin:
    name: unity plug-in · compile + run (stand-in editor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "trimesh<6" "pillow<13" numpy charset-normalizer DracoPy
      - name: Unity plug-in suite
        run: python tests/test_engine_plugins.py --only unity --require

  # plugins/godot in a real Godot: the add-on's check code headless, then the
  # editor itself importing a project with the add-on enabled.
  godot-plugin:
    name: godot plug-in · headless 4.2.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "trimesh<6" "pillow<13" numpy charset-normalizer DracoPy
      - name: Download Godot 4.2.2 (checksum from the release's SHA512-SUMS.txt)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          echo "4c0294f437b97cf14f848d921ed028cb6e100ebbfcf6480f2d50292d001221cf29cda73f0a96a8c0e80b145b65cdbf7e422252dbbe17e79d883753e500306276  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.2.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Godot plug-in suite
        run: python tests/test_engine_plugins.py --only godot --require

  # What `pip install` gives a user: a wheel whose packages sit under agk_suite/
  # (not top-level server/, tools/ ...) and servers that keep their data out of
  # site-packages (9 Nov 2026 audit, B2 and B3).
  package:
    name: package · install from a wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m venv /tmp/agk
          /tmp/agk/bin/pip install dist/*.whl
      - name: Nothing lands at the top of site-packages but our own names
        run: |
          site=$(/tmp/agk/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          for name in server tools engine enterprise plugins; do
            if [ -e "$site/$name" ]; then echo "$name/ installed at the top of site-packages"; exit 1; fi
          done
          test -d "$site/agk_suite/server/static/vendor"
      - name: The installed commands start, serve and stop
        run: |
          mkdir -p /tmp/project && cd /tmp/project
          export HOME=/tmp/home
          /tmp/agk/bin/asset-gatekeeper --version
          /tmp/agk/bin/agk-serve up
          curl -sf http://127.0.0.1:8100/viewer > /dev/null
          curl -sf http://127.0.0.1:8100/static/vendor/three.module.js > /dev/null
          /tmp/agk/bin/agk-serve down
          site=$(/tmp/agk/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          if ls "$site"/*.db "$site"/.agk 2>/dev/null; then echo "data written into site-packages"; exit 1; fi
          test -f /tmp/home/.local/share/asset-gatekeeper/asset_health.db

  # A first-time user: GitHub's "Download ZIP" (git archive), unzipped into an
  # empty folder, on a Python with nothing installed, through the same files the
  # README names - Install_Extras.bat, Start AssetGatekeeper.bat, a scan, a Polypaint bake,
  # Stop.bat. On Windows the .bat files themselves run (10 Nov 2026).
  fresh-install:
    name: fresh install · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.9" }
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Download ZIP, the way a user gets it
        shell: bash
        run: |
          git -C src archive --format=zip --prefix=AssetGateKeeper-main/ -o "$RUNNER_TEMP/agk.zip" HEAD
          mkdir "$RUNNER_TEMP/user"
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/agk.zip" "$RUNNER_TEMP/user"
      - name: Install, start, scan, bake, stop
        shell: bash
        working-directory: ${{ runner.temp }}/user/AssetGateKeeper-main
        run: python tests/fresh_install.py

  # The Art Workstation viewer in a real browser. The API suite passed for
  # months while the page showed the wrong model, refused embedded glTF
  # buffers and crashed on Geometry -> Textured; only a browser sees that.
  viewer-browser:
    name: viewer · chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install trimesh pillow numpy playwright charset-normalizer
          python -m playwright install --with-deps chromium

      - name: Viewer suite (Chromium)
        run: python tests/test_viewer_browser.py
