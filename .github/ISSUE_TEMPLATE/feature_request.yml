name: Feature request
description: A rule, format, editor or engine you'd like it to support.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: The asset problem it should catch, or the step it should save.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: input
    id: tools
    attributes:
      label: Which editor, engine or file format
